apiVersion: batch/v1
kind: Job
metadata:
  name: job-demo
spec:
  completions: 5
  backoffLimit: 3
  parallelism: 3
  # activeDeadlineSeconds: 70
  # suspend: false  
  ttlSecondsAfterFinished: 10
  template:
    metadata:
      name: job-demo
    spec:
      containers:
      - name: job-demo
        image: desenvolvedorio/dominando-kubernetes:pod-lifecycle-succeeded
      restartPolicy: OnFailure